name: Deploy research map
on:
  push:
    branches: [main]
    paths:
      - 'atlas/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public files and history
        run: python3 scripts/check_public_files.py --history
      - name: Check the committed map matches its sources
        run: python3 scripts/build_atlas.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas/dist
      - id: deployment
        uses: actions/deploy-pages@v4
